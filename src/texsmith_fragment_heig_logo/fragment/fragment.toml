# Declarative description of the heiglogo fragment.
#
# TeXSmith 0.8 resolves a fragment directory through the ``entrypoint`` key: the
# class it names owns the name, the description, the pieces and the attributes,
# so they are not restated here (0.8 rejects a manifest that spells ``name`` or
# ``description`` next to ``entrypoint``). Pointing TeXSmith at this directory
# by path therefore yields exactly the same object as the ``texsmith.fragments``
# entry point declared in pyproject.toml, including the date-driven vintage
# selection that lives in Python.
entrypoint = "texsmith_fragment_heig_logo:load_fragment"
